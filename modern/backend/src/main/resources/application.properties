# ============================================================
# Modern Banking Backend — Application Configuration
# ============================================================

# Server
server.port=8080

# SQLite datasource — path relative to working directory (project root)
# Override at runtime: -Dspring.datasource.url=jdbc:sqlite:/absolute/path/legacybank.db
spring.datasource.url=jdbc:sqlite:../../legacybank.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# SQLite stores all integer types as INTEGER; use 'none' to avoid false type mismatch errors
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Use the exact column/table names from @Table/@Column (no lowercase conversion)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# SQLite foreign-key enforcement
spring.jpa.properties.hibernate.connection.foreign_keys=true

# JWT
# Override in production via environment variable JWT_SECRET
app.jwt.secret=${JWT_SECRET:modernbankingappsecretkey2024xyzchangethisinproduction}
app.jwt.expiration-ms=86400000

# CORS — allow the Vite dev server and the Docker frontend
app.cors.allowed-origins=http://localhost:5173,http://localhost:80,http://localhost

# Logging
logging.level.com.modernbank=INFO
logging.level.org.hibernate.SQL=WARN
